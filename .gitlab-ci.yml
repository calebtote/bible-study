# Publishes the study to GitLab Pages as a static export.
#
# The app has exactly one thing a static host cannot serve: the ESV proxy route,
# which exists only to keep the ESV credential off the client. `npm run build:pages`
# (scripts/build-static.mjs) removes that route for the duration of this build alone;
# every reader on Pages reads the bundled World English Bible instead, which is the
# whole reason that translation is bundled in full rather than fetched on demand.
#
# `NEXT_PUBLIC_BASE_PATH` is computed from `$CI_PAGES_URL`, which GitLab always sets to
# wherever this build will actually be served: a project without a custom domain
# (https://<namespace>.gitlab.io/<project>/), a group's or user's root Pages site
# (https://<namespace>.gitlab.io/), or a custom domain. Deriving it here means nothing
# in this file or in the app needs to know which of those applies.

image: node:22-slim

stages:
  - build

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

pages:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - npm ci
    - export NEXT_PUBLIC_BASE_PATH=$(node -e "process.stdout.write(new URL(process.env.CI_PAGES_URL).pathname.replace(/\/$/, ''))")
    - echo "Publishing under base path '$NEXT_PUBLIC_BASE_PATH'"
    - npm run build:pages
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
